name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'scripts/**/*.test.mjs'

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop/lilishop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 沿用上游根 pom 的 skipTests=true：编译主代码与测试代码，不跑上游测试（原因见 docs/upstream.md「已知上游问题」）
      - run: mvn -B -pl manager-api,buyer-api -am verify
