name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'scripts/**/*.test.mjs'

  backend:
    runs-on: ubuntu-latest
    services:
      # 与 deploy/compose.yaml 同版本；端口沿用 deploy/ports.env 的 LIROAM_MYSQL_PORT（集成测试只认这个端口）
      mysql:
        image: mysql:8.0.30
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 39306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      LIROAM_MYSQL_ROOT_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 仓根 reactor：上游根 pom 的 lilishop.skipTests=true，只编译（原因见 docs/upstream.md「已知上游问题」）；
      # 自研 modules 不继承该属性，单测、契约套件、集成测试与架构检查全部在此运行
      - run: mvn -B -pl shop/lilishop/manager-api,shop/lilishop/buyer-api,modules/liroam-architecture-tests,modules/liroam-smoke-tests -am verify
