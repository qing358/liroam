<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>认领渠道订单 · 轻游</title><link rel="stylesheet" href="../styles.css"></head>
<body data-nav="cards" data-back="18-account.html" data-title="认领渠道订单" data-footer="no">
<main><div class="container" style="max-width:640px">
  <div class="card stack-lg">
    <div><h1>认领渠道订单</h1><p class="sub" style="font-size:14px;margin-top:6px">在京东、小红书购买的轻游旅行卡，认领后可在「我的卡」查看用量、加包。</p></div>
    <div class="field"><label>购买渠道</label><div class="seg"><a class="on">京东</a><a>小红书</a></div></div>
    <div class="field"><label>订单号</label><div class="input"><span class="ph">在渠道 App 的订单详情中复制</span></div></div>
    <div class="field"><label>下单手机号</label><div class="input"><span class="ph">下单时填写的收货手机号</span></div></div>
    <a class="btn btn-primary btn-lg btn-block">认领</a>
    <div class="notice"><i data-i="info"></i><span>每个订单只能认领到一个账号。认领的卡不能在本站整卡退款，请回原渠道办理；在本站加购的加包可在本站退款。</span></div>
    <p class="anno-note">渠道列表取已启用渠道；成功后跳「我的卡」并高亮新卡；失败文案按接口错误码给出（订单号或手机号不匹配、已被认领）</p>
  </div>
</div></main>
<script src="../kit.js"></script>
</body></html>
