<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的佣金 · 轻游</title><link rel="stylesheet" href="../styles.css"></head>
<body data-back="18-account.html" data-title="我的佣金" data-footer="no">
<main><div class="container" style="max-width:880px">
  <div class="stack">
    <h1 class="hide-m">我的佣金</h1>
    <div class="card" style="background:var(--lr-ink);color:white;border:0">
      <p style="color:color-mix(in srgb,white 70%,var(--lr-ink));font-size:14px">可提现（元）</p>
      <div class="between" style="margin-top:4px"><span class="num" style="font-size:34px;color:var(--lr-sun)">326.40</span><a class="btn btn-primary">申请提现</a></div>
      <div class="row" style="gap:32px;margin-top:16px;font-size:14px;color:color-mix(in srgb,white 75%,var(--lr-ink))"><span>待结算 128.00</span><span>累计 1,286.40</span></div>
    </div>
    <div class="card stack">
      <div class="between"><h3>分享给朋友</h3><a class="btn btn-outline btn-sm"><i data-i="copy" class="icon-sm"></i>复制推广链接</a></div>
      <p class="muted">朋友通过你的链接下单，交付后计入你的佣金。</p>
    </div>
    <div class="tabs"><a class="on">佣金明细</a><a>提现记录</a></div>
    <div class="list">
      <div><span class="grow"><b>日本 eSIM 7 天 5GB</b><span class="muted" style="display:block">订单 …5678 · 11月28日 · 待结算</span></span><span class="num">+7.80</span></div>
      <div><span class="grow"><b>欧洲多国 15 天 10GB</b><span class="muted" style="display:block">订单 …0917 · 11月20日 · 可提现</span></span><span class="num">+12.00</span></div>
      <div><span class="grow"><b>退款冲回</b><span class="muted" style="display:block">订单 …3301 · 11月18日</span></span><span class="num price">-4.50</span></div>
    </div>
    <p class="anno-note">金额与状态取佣金台账接口；提现为申请 → 审批 → 线下打款，提现记录展示各阶段</p>
  </div>
</div></main>
<script src="../kit.js"></script>
</body></html>
