      <h1>什么时候安装 eSIM 最合适？</h1>
      <div class="stack sub">
        <p>建议在出发前一到两天、连着 Wi-Fi 时安装。安装只是把卡添加到手机上，到达目的地并开启这张卡的数据漫游后才开始上网。</p>
        <p>安装时请确认手机系统已更新，安装过程中不要关闭页面。安装完成后，先在设置里关闭这张卡的数据漫游，落地后再打开。</p>
      </div>
