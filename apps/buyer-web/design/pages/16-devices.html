<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>支持 eSIM 的手机 · 轻游</title><link rel="stylesheet" href="../styles.css"></head>
<body data-nav="help" data-back="15-help.html" data-title="设备兼容" data-login="no">
<main><div class="container" style="max-width:880px">
  <div class="stack">
    <h1>我的手机支持 eSIM 吗</h1>
    <div class="card stack">
      <h3>最快的确认方法</h3>
      <div class="steps">
        <div class="step"><div><h3>拨号界面输入 *#06#</h3><p class="muted">显示 EID 一栏，说明手机支持 eSIM</p></div></div>
        <div class="step"><div><h3>确认手机没有锁网</h3><p class="muted">运营商合约机可能只能用该运营商的卡，可咨询购机渠道</p></div></div>
      </div>
    </div>
    <div class="search" style="box-shadow:none"><i data-i="search"></i><input placeholder="搜索机型，如 iPhone 15、Mate 60"></div>
    <div class="chips"><span class="chip on">苹果</span><span class="chip">三星</span><span class="chip">谷歌</span><span class="chip">华为</span><span class="chip">小米</span><span class="chip">OPPO</span><span class="chip">vivo</span><span class="chip">其它</span></div>
    <div class="list">
      <div><span class="grow">iPhone 16 系列</span><span class="badge badge-primary">支持</span></div>
      <div><span class="grow">iPhone 15 系列</span><span class="badge badge-primary">支持</span></div>
      <div><span class="grow">iPhone XS 至 iPhone 14 系列</span><span class="badge badge-primary">支持</span></div>
      <div><span class="grow">中国大陆版 iPhone<span class="muted" style="display:block">多数型号为双实体卡槽，不支持 eSIM，可选实体卡套餐</span></span><span class="badge badge-accent">部分支持</span></div>
    </div>
    <div class="notice"><i data-i="info"></i><span>手机不支持 eSIM？可以选择实体卡套餐，下单后寄送到家。</span></div>
    <p class="anno-note">机型清单为壳文章内容，运营维护；此处为结构示例，具体机型以运营发布为准</p>
  </div>
</div></main>
<script src="../kit.js"></script>
</body></html>
