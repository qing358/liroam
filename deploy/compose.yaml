# liroam 本机专用中间件。镜像版本、my.cnf、初始化 SQL 跟随上游 docker 仓（见 docs/upstream.md）。
# 端口来自 deploy/ports.env，口令来自仓根 .env（不入库，scripts/dev.mjs 首次运行时生成）。
name: liroam

services:
  mysql:
    image: mysql:8.0.30
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LIROAM_MYSQL_ROOT_PASSWORD:?缺少 LIROAM_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lilishop
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${LIROAM_MYSQL_PORT:?}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../shop/docker/config/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # 只用完整基线初始化空库；上游 patches/ 用于升级旧库，在空库或新基线上执行会报错（见 docs/upstream.md）
      - ../shop/docker/init/mysql/lilishop.sql:/docker-entrypoint-initdb.d/lilishop.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -h127.0.0.1 -e 'SELECT 1 FROM lilishop.li_admin_user LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  redis:
    image: redis:7.0.4
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${LIROAM_REDIS_PASSWORD:?缺少 LIROAM_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes"]
    ports:
      - "127.0.0.1:${LIROAM_REDIS_PORT:?}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
